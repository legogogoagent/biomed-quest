name = "sensorcraft-log"
main = "worker.js"
compatibility_date = "2026-11-06"
workers_dev = true

[vars]
GITHUB_OWNER = "legogogoagent"
GITHUB_REPO = "biomed-quest"
ALLOWED_ORIGINS = "https://legogogoagent.github.io"
RATE_LIMIT_PER_HOUR = "10"
# ISSUE_LABELS = "sensorcraft-log"

# Optional but recommended: per-IP rate limiting.
# Create with: npx wrangler kv namespace create LOG_KV
# then paste the returned id here and uncomment:
# [[kv_namespaces]]
# binding = "LOG_KV"
# id = "REPLACE_WITH_KV_NAMESPACE_ID"
