/* ./css/tokens.css */
/* SENSORCRAFT design tokens — Minecraft GUI */
:root {
  --bg-deepslate: #2a2a32;
  --bg-stone: #44444c;
  --bg-dirt: #7a4f28;
  --panel: #d6d6d6;
  --panel-dark: #a0a0a0;
  --panel-darker: #808080;
  --slot: #a4a4a4;
  --slot-hover: #bebebe;
  --bevel-light: #ffffff;
  --bevel-mid: #b4b4b4;
  --bevel-dark: #3a3a3a;
  --text-light: #f2f2f2;
  --text-dim: #b8b8b8;
  --text-dark: #2f2f2f;
  --xp-green: #7fff2a;
  --grass: #6fbf3a;
  --grass-dark: #3f7a2e;
  --sky: #7fc4ff;
  --xp-dark: #2e7d32;
  --gold: #ffd700;
  --gold-dark: #b8860b;
  --redstone: #ff4d4d;
  --redstone-dark: #8b1a1a;
  --lapis: #4a6cff;
  --sculk-cyan: #55ffff;
  --sculk-dark: #1a6b7a;
  --amethyst: #2a0a4a;
  --amethyst-light: #7a4fd0;
  --tooltip-bg: #100010;
  --emerald: #17dd62;
  --diamond: #33e0e0;

  --font-pixel: "Monocraft", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --font-cjk: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;

  --bevel-out: inset 2px 2px 0 var(--bevel-light), inset -2px -2px 0 var(--bevel-dark);

/* ./css/base.css */
/* reset + world background + typography */
*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  height: 100%;
  -webkit-text-size-adjust: 100%;
}

body {
  min-height: 100%;
  margin: 0;
  background-color: var(--bg-stone);
  background-image: linear-gradient(180deg, rgba(111, 191, 58, 0.20), transparent 240px), var(--tex-stone);
  color: var(--text-light);
  font-family: var(--font-cjk);
  font-size: 14px;
  line-height: 1.45;
  overscroll-behavior-y: none;
  -webkit-tap-highlight-color: transparent;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(ellipse at 50% -10%, rgba(255, 255, 255, 0.10), transparent 55%),
    linear-gradient(180deg, transparent 45%, rgba(0, 0, 0, 0.32));
}

#app {
  position: relative;
  z-index: 1;
  min-height: 100dvh;
  padding-bottom: calc(40px + var(--safe-bottom));
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
  border-radius: 0;
}

button {
  cursor: pointer;
}

a {
  color: var(--gold);
}

h1,
h2,
h3,
p {
  margin: 0;
}

ul,
ol {
  margin: 0;
  padding: 0;
  list-style: none;
}

canvas {
  display: block;
  image-rendering: pixelated;
}

svg {
  display: block;
}

::selection {
  background: var(--lapis);
  color: #fff;
}

:focus-visible {
  outline: 3px solid var(--gold);
  outline-offset: 2px;
}

.sr-only {
  position: absolute !important;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.pixel {
  font-family: var(--font-pixel);
}

.shadow-soft {
  text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.75);
}

.shadow-dark {
  text-shadow: 1px 1px 0 #3f3f3f;
}

.text-dim {
  color: var(--text-dim);
}

.text-gold {
  color: var(--gold);
}

.text-green {
  color: var(--xp-green);
}

.text-red {
  color: var(--redstone);
}

.text-cyan {
  color: var(--sculk-cyan);
}

.hidden,
[hidden] {
  display: none !important;
}

::-webkit-scrollbar {
  width: 12px;
  height: 12px;
}

::-webkit-scrollbar-track {
  background: var(--bg-deepslate);
  box-shadow: var(--bevel-in);
}

::-webkit-scrollbar-thumb {
  background: var(--panel-dark);
  border: 2px solid var(--bg-deepslate);
  box-shadow: inset 1px 1px 0 #c6c6c6, inset -1px -1px 0 #555;
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
}

</style>

/* ./css/layout.css */
/* app shell, inventory, workbench, HUD layout */
#hud {
  position: sticky;
  top: 0;
  z-index: 30;
  padding-top: var(--safe-top);
  background-color: #2b4a1c;
  background-image: var(--tex-stone);
  border-bottom: 3px solid var(--grass);
  box-shadow: 0 2px 0 #17260f;
}

.hud-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  max-width: 1100px;
  min-height: 44px;
  margin: 0 auto;
  padding: 6px 12px;
}

.hud-brand {
  display: flex;
  align-items: baseline;
  gap: 8px;
  min-width: 0;
  font-family: var(--font-pixel);
  font-size: 13px;
  color: var(--gold);
  text-shadow: 2px 2px 0 #000;
  white-space: nowrap;
}

.hud-brand .hud-cube {
  display: inline-grid;
  place-items: center;
  width: 20px;
  height: 20px;
  background: var(--xp-green);
  color: #1b1b1f;
  box-shadow: inset 2px 2px 0 #d6ff9a, inset -2px -2px 0 #2e7d32;
  font-size: 12px;
  transform: translateY(2px);
}

.hud-brand .hud-version {
  font-size: 8px;
  color: var(--text-dim);
  text-shadow: 1px 1px 0 #000;
}

.hud-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: flex-end;
}

#f3-panel {
  position: fixed;
  top: calc(var(--safe-top) + 62px);
  left: 8px;
  z-index: 35;
  max-width: min(92vw, 360px);
  padding: 8px 10px;
  background: rgba(0, 0, 0, 0.82);
  border: 1px solid #4a4a50;
  color: #e8e8e8;
  font-family: var(--font-pixel);
  font-size: 9px;
  line-height: 1.7;
  white-space: pre-wrap;
  pointer-events: none;
}

#secure-banner {
  padding: 6px 12px;
  background: #4a1010;
  border-bottom: 2px solid var(--redstone-dark);
  color: #ffd6d6;
  font-size: 12px;
  text-align: center;
}

#bag-view {
  max-width: 820px;
  margin: 0 auto;
  padding: 16px 12px 24px;
}

.inventory {
  position: relative;
  background-color: var(--panel);
  color: var(--text-dark);
  box-shadow: var(--bevel-out);
  border: 2px solid #3a3a3a;
}

.inventory::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0.12;
  background-image: var(--tex-stone);

}

.inv-titlebar {

  border-bottom: 3px solid var(--grass-dark);
  box-shadow: 0 1px 0 #ffffff;
  background: #d0d0d0;
}

.inv-title {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.inv-title-icon {
  flex: 0 0 auto;
  width: 36px;
  height: 36px;
  display: grid;
  place-items: center;

}

.inv-title-icon svg {
  width: 28px;
  height: 28px;
}

.inv-title h1 {

  color: #3f3f3f;

#bench-view {

.bench-titlebar {

  grid-template-columns: auto minmax(0, 1fr) auto;

  gap: 10px;
  padding: calc(var(--safe-top) + 8px) 12px 8px;
  background-color: var(--panel);
  color: var(--text-dark);
  box-shadow: 0 2px 0 #1b1b1f;

.bench-title {
  display: flex;
  align-items: center;
  gap: 9px;
  min-width: 0;
}

.bench-title-icon {

  height: 34px;

  display: grid;
  place-items: center;

  box-shadow: var(--bevel-slot);

.bench-title-icon svg {

  height: 26px;

.bench-body {

(function (SC) {
  'use strict';
  var dom = SC.core.dom;

  function friendlyError(error) {
    var name = error && error.name;
    if (name === 'NotAllowedError' || name === 'SecurityError') {
      return '摄像头权限被拒绝。请在 Safari 的网站设置里允许摄像头，或重新点击开始。';
    }
    if (name === 'NotFoundError' || name === 'OverconstrainedError') {
      return '没有找到可用的摄像头。';
    }
    if (name === 'NotReadableError' || name === 'AbortError') {
      return '摄像头被其他 App 占用，先关闭相机/视频通话再试。';
    }
    return (error && error.message) || '无法启动摄像头。';
  }

  function readoutHtml(state) {
    return (
      '<div class="readout-title"><span>观察者之眼</span><span>OBSERVER</span></div>' +
      '<div class="readout-row"><span class="readout-label">分辨率</span><span class="readout-value">' +
      state.resolution +
      '</span></div>' +
      '<div class="readout-row"><span class="readout-label">帧率</span><span class="readout-value">' +
      state.fps +
      ' fps</span></div>' +
      '<div class="readout-row"><span class="readout-label">镜头</span><span class="readout-value">' +
      (state.facing === 'user' ? '前置' : '后置') +
      '</span></div>' +
      '<div class="readout-row"><span class="readout-label">中心颜色</span><span class="readout-value"><span class="color-swatch" style="background:' +
      state.hex +
      '"></span> ' +
      state.hex +
      '</span></div>' +
      '<div class="readout-row"><span class="readout-label">亮度</span><span class="readout-value">' +
      state.brightness +
      ' / 100</span></div>' +
      '<div class="readout-row"><span class="readout-label">状态</span><span class="readout-value">' +
      state.status +
      '</span></div>'
    );
  }

  SC.registerSensor({
    id: 'camera',
    name: '摄像头',
    en: 'CAMERA',
    group: '影像与声音',
    icon: 'camera',
    probe: function (feature) {
      if (!feature.secure) {
        return {
          status: 'locked',
          reason: '摄像头需要 HTTPS 或 localhost，当前不是安全上下文。'
        };
      }
      if (!feature.media) {
        return { status: 'locked', reason: '当前浏览器不支持 getUserMedia。' };
      }
      return { status: 'ready' };
    },
    mount: function (ctx) {
      var state = {
        facing: 'environment',
        fps: 0,
        resolution: '--',
        hex: '#000000',
        brightness: 0,
        status: '等待授权'
      };
      var stream = null;
      var streamGeneration = 0;
      var firstFrame = false;
      var firstShot = false;
      var paused = false;
      var sampleCanvas = document.createElement('canvas');
      sampleCanvas.width = 16;
      sampleCanvas.height = 16;
      var sampleCtx = sampleCanvas.getContext('2d', { willReadFrequently: true });

      ctx.root.innerHTML =
        '<div class="module module-camera">' +
        '<div class="stage-frame ratio-4x3">' +
        '<div class="cam-viewport"><video id="cam-video" autoplay playsinline muted></video>' +
        '<div class="cam-crosshair"></div><div class="cam-flash" id="cam-flash"></div></div>' +
        '<div class="frame-hud"><span class="hud-chip" id="cam-res">--</span>' +
        '<span class="hud-chip"><span class="rec-dot"></span> REC</span></div>' +
        '<div class="frame-corners"><span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span></div>' +
        '<div class="stage-overlay" id="cam-paused" hidden>已暂停<br><span>点击「继续」重新打开摄像头</span></div>' +
        '</div>' +
        '<div class="axis-row" style="margin-top:8px"><span class="axis-name">LIGHT</span><div class="meter"><div class="meter-fill gold" id="cam-light-bar"></div></div><span class="axis-num" id="cam-light-val">0</span></div>' +
        '<div class="module-toolbar">' +
        '<button class="mc-btn" type="button" id="cam-switch">切换镜头</button>' +
        '<button class="mc-btn primary" type="button" id="cam-shot">拍照</button>' +
        '<button class="mc-btn" type="button" id="cam-copy">复制色值</button>' +
        '<button class="mc-btn danger" type="button" id="cam-pause">暂停</button>' +
        '<span class="spacer"></span>' +
        '<span class="module-note" id="cam-note">正在申请摄像头…</span>' +
        '</div></div>';

      var video = ctx.root.querySelector('#cam-video');
      var flash = ctx.root.querySelector('#cam-flash');
      var note = ctx.root.querySelector('#cam-note');
      var resChip = ctx.root.querySelector('#cam-res');
      var switchBtn = ctx.root.querySelector('#cam-switch');
      var shotBtn = ctx.root.querySelector('#cam-shot');
      var pauseBtn = ctx.root.querySelector('#cam-pause');
      var copyBtn = ctx.root.querySelector('#cam-copy');
      var pausedOverlay = ctx.root.querySelector('#cam-paused');
      var lightBar = ctx.root.querySelector('#cam-light-bar');

      async function start() {
        var generation = ++streamGeneration;
        stopStream();
        state.status = '申请中';
        refreshReadout();
        note.textContent = '正在申请摄像头…';
        try {
          var next = await ctx.ensureStream({
            audio: false,
            video: {
              facingMode: state.facing,
              width: { ideal: 1280 },
              height: { ideal: 720 }

          });

              track.stop();
            });
            return;
          }
          stream = next;
          video.srcObject = stream;
          await video.play().catch(function () {});
          paused = false;
          pausedOverlay.hidden = true;
          pauseBtn.textContent = '暂停';
          state.resolution = video.videoWidth + '×' + video.videoHeight;
          state.status = '运行中';
          note.textContent = '画面正常';
          refreshReadout();
          if (!firstFrame) {
            firstFrame = true;
            ctx.toast({ icon: 'camera', title: '成就达成！', subtitle: '睁眼看世界：第一次看到摄像头画面' });
          }
          SC.core.log.add('摄像头已启动（' + (state.facing === 'user' ? '前置' : '后置') + '）');
        } catch (error) {
          if (!ctx.isActive()) return;
          state.status = '失败';
          note.textContent = '无法启动';
          refreshReadout();
          ctx.showError(new Error(friendlyError(error)), error && error.name);
        }
      }

      function sample() {
        if (!stream || !video.videoWidth) return;
        sampleCtx.drawImage(video, 0, 0, 16, 16);
        var data = sampleCtx.getImageData(6, 6, 4, 4).data;
        var r = 0;
        var g = 0;
        var b = 0;
        var count = 0;
        for (var i = 0; i < data.length; i += 4) {
          r += data[i];
          g += data[i + 1];
          b += data[i + 2];
          count += 1;
        }
        r = Math.round(r / count);
        g = Math.round(g / count);
        b = Math.round(b / count);
        state.hex = '#' + [r, g, b].map(function (v) {
          return v.toString(16).padStart(2, '0');
        }).join('');
        state.brightness = Math.round(((0.299 * r + 0.587 * g + 0.114 * b) / 255) * 100);
        state.fps = Math.round(videoFps);
        lightBar.style.width = state.brightness + '%';
        lightVal.textContent = state.brightness;
        refreshReadout();
      }

      var videoFps = 0;
      var frameCount = 0;
      var frameLast = performance.now();
      function updateFps(now) {
        frameCount += 1;
        if (now - frameLast >= 1000) {
          videoFps = (frameCount * 1000) / (now - frameLast);
          frameCount = 0;
          frameLast = now;
        }
      }
      if ('requestVideoFrameCallback' in HTMLVideoElement.prototype) {
        var onVideoFrame = function (now) {
          if (!ctx.isActive()) return;
          updateFps(now);
          if (video.srcObject) video.requestVideoFrameCallback(onVideoFrame);
        };
        video.requestVideoFrameCallback(onVideoFrame);
      } else {
        ctx.raf(function (now) {
          if (video.srcObject) updateFps(now);
        });
      }

      switchBtn.addEventListener('click', function () {
        state.facing = state.facing === 'environment' ? 'user' : 'environment';
        start();
      });

      shotBtn.addEventListener('click', function () {
        if (!video.videoWidth) {
          ctx.toast({ icon: 'barrier', title: '还没有画面', subtitle: '等摄像头启动后再拍照' });
          return;
        }
        var canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        flash.classList.remove('is-flash');
        void flash.offsetWidth;
        flash.classList.add('is-flash');
        canvas.toBlob(function (blob) {
          if (!blob) return;
          var url = URL.createObjectURL(blob);
          var a = document.createElement('a');
          a.href = url;
          a.download = 'sensorcraft-' + Date.now() + '.png';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(function () {
            URL.revokeObjectURL(url);
          }, 3000);
          if (!firstShot) {
            firstShot = true;
            ctx.toast({ icon: 'map', title: '成就达成！', subtitle: '记录者：拍下第一张传感器照片' });
          }
          SC.core.log.add('已拍照 ' + canvas.width + '×' + canvas.height);
        }, 'image/png');
      });

      pauseBtn.addEventListener('click', function () {
        if (paused) {
          start();
          SC.core.log.add('摄像头已继续');
        } else {
          streamGeneration += 1;
          stopStream();
          paused = true;
          state.status = '已暂停';
          note.textContent = '已暂停，摄像头已释放';
          pauseBtn.textContent = '继续';
          pausedOverlay.hidden = false;
          refreshReadout();
          SC.core.log.add('摄像头已暂停');
        }
      });

      copyBtn.addEventListener('click', function () {
        dom.copyText(state.hex).then(function () {

          ctx.toast({ icon: 'barrier', title: '复制失败', subtitle: '请手动长按选择色值' });
        });
      });

      ctx.interval(sample, 250);
      refreshReadout();
      start();
    }
  });
})(window.SC = window.SC || {});

        '<div class="module module-touch">' +
        '<div class="touch-stage"><canvas id="touch-canvas"></canvas>' +

        '<button class="mc-btn" type="button" id="touch-reset">重置纪录</button>' +

          apply(Number(input.value));
        });
        controls.appendChild(row);
        return input;
      }

      function modeButtons(label, modes, apply) {
        var wrap = document.createElement('div');
        wrap.className = 'module-toolbar';
        wrap.style.marginTop = '6px';
        var title = document.createElement('span');
        title.className = 'module-note';
        title.textContent = label + '：';
        wrap.appendChild(title);
        modes.forEach(function (mode) {
          var button = document.createElement('button');
          button.type = 'button';
          button.className = 'mc-btn tiny';
          button.textContent = modeLabel(mode);
          button.addEventListener('click', function () {
            Array.prototype.forEach.call(wrap.querySelectorAll('button'), function (item) {
              item.setAttribute('aria-pressed', String(item === button));
            });
            apply(mode);
          });
          wrap.appendChild(button);
        });
        controls.appendChild(wrap);
      }

      async function applyConstraint(constraint) {
        if (!track) return;
        try {
          await track.applyConstraints({ advanced: [constraint] });
          note.textContent = '已应用：' + JSON.stringify(constraint);
          if (!manualStarted) {
            manualStarted = true;
            ctx.toast({ icon: 'cameraManual', title: '成就达成！', subtitle: '红石工程师：第一次手动控制相机' });
          }
          SC.core.log.add('手动相机约束：' + JSON.stringify(constraint));
        } catch (error) {
          note.textContent = '应用失败：' + (error && error.message ? error.message : '设备拒绝');
        }
      }

      function detect() {
        controls.innerHTML = '';
        if (!track || !track.getCapabilities) {
          setReadout('#manual-r-status', '不支持');
          note.textContent = '当前浏览器没有 track.getCapabilities()。';
          return;
        }
        caps = track.getCapabilities();
        setReadout('#manual-r-zoom', caps.zoom ? caps.zoom.min + ' – ' + caps.zoom.max : '不支持');
        setReadout('#manual-r-focus', caps.focusMode ? caps.focusMode.map(modeLabel).join(' / ') : '不支持');
        setReadout('#manual-r-exposure', caps.exposureMode ? caps.exposureMode.map(modeLabel).join(' / ') : '不支持');
        setReadout('#manual-r-wb', caps.whiteBalanceMode ? caps.whiteBalanceMode.map(modeLabel).join(' / ') : '不支持');
        setReadout('#manual-r-torch', 'torch' in caps ? '支持' : '不支持');
        chip.textContent = caps.zoom || caps.focusMode || caps.exposureMode || caps.whiteBalanceMode ? 'CAPABILITIES' : 'LIMITED';

        if (caps.zoom) {
          slider('变焦', caps.zoom.min, caps.zoom.max, caps.zoom.step || 0.1, function (value) {
            applyConstraint({ zoom: value });
          });
        }
        if (caps.exposureCompensation) {
          var ec = caps.exposureCompensation;
          slider('曝光补偿', ec.min, ec.max, ec.step || 1, function (value) {
            applyConstraint({ exposureCompensation: value });
          });
        }
        if (caps.focusMode && caps.focusMode.length > 1) {
          modeButtons('对焦模式', caps.focusMode, function (mode) {
            applyConstraint({ focusMode: mode });
          });
        }
        if (caps.exposureMode && caps.exposureMode.length > 1) {
          modeButtons('曝光模式', caps.exposureMode, function (mode) {
            applyConstraint({ exposureMode: mode });
          });
        }
        if (caps.whiteBalanceMode && caps.whiteBalanceMode.length > 1) {
          modeButtons('白平衡', caps.whiteBalanceMode, function (mode) {
            applyConstraint({ whiteBalanceMode: mode });
          });
        }
        if ('torch' in caps) {
          var torchWrap = document.createElement('div');
          torchWrap.className = 'module-toolbar';
          torchWrap.style.marginTop = '6px';
          var torchLever = document.createElement('button');
          torchLever.type = 'button';
          torchLever.className = 'lever';
          torchLever.setAttribute('aria-pressed', 'false');
          torchLever.innerHTML = '<span class="lever-base"><span class="lever-knob"></span></span><span class="lever-label">补光灯</span>';
          torchLever.addEventListener('click', function () {
            torchOn = !torchOn;
            torchLever.setAttribute('aria-pressed', String(torchOn));
            applyConstraint({ torch: torchOn });
          });
          torchWrap.appendChild(torchLever);
          controls.appendChild(torchWrap);
        }

        if (!caps.zoom && !caps.focusMode && !caps.exposureMode && !caps.exposureCompensation && !caps.whiteBalanceMode && !('torch' in caps)) {
          note.textContent = '设备没有暴露变焦/对焦/曝光能力。iOS Safari 通常只给基本取景。';
          setReadout('#manual-r-status', '受限');
          ctx.setStatus('LIMITED', 'partial');
        } else {
          note.textContent = '可以尝试下面的真实控制。';
          setReadout('#manual-r-status', '可用');
          ctx.setStatus('READY', '');
        }
      }

      async function start() {
        try {
          stream = await ctx.ensureStream({
            audio: false,
            video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
          });
          track = stream.getVideoTracks()[0];
          video.srcObject = stream;
          await video.play().catch(function () {});
          detect();
        } catch (error) {
          ctx.showError(error, error && error.name);
        }
      }

      resetBtn.addEventListener('click', function () {
        if (!track) {
          ctx.toast({ icon: 'cameraManual', title: '相机未启动', subtitle: '先等相机画面出现' });
          return;
        }
        var defaults = {};
        if (caps.zoom) defaults.zoom = caps.zoom.min;
        if (caps.focusMode && caps.focusMode.indexOf('continuous') >= 0) defaults.focusMode = 'continuous';
        if (caps.exposureMode && caps.exposureMode.indexOf('continuous') >= 0) defaults.exposureMode = 'continuous';
        if (caps.whiteBalanceMode && caps.whiteBalanceMode.indexOf('continuous') >= 0) defaults.whiteBalanceMode = 'continuous';
        if ('torch' in caps) defaults.torch = false;
        torchOn = false;
        applyConstraint(defaults);
        controls.innerHTML = '';
        detect();
        ctx.toast({ icon: 'cameraManual', title: '控制已重置', subtitle: '变焦/对焦/曝光/白平衡恢复默认' });
      });

      copyBtn.addEventListener('click', function () {
        if (!track || !caps) {
          ctx.toast({ icon: 'barrier', title: '没有能力信息', subtitle: '先等相机启动' });
          return;
        }
        dom.copyText(JSON.stringify(caps, null, 2)).then(function () {
          ctx.toast({ icon: 'cameraManual', title: '能力已复制', subtitle: 'getCapabilities() JSON' });
        }).catch(function () {
          ctx.toast({ icon: 'barrier', title: '复制失败', subtitle: '浏览器拒绝剪贴板写入' });
        });
      });

      stopBtn.addEventListener('click', function () {
        if (stream) {
          stream.getTracks().forEach(function (t) {
            t.stop();
          });
          stream = null;
          track = null;
        }
        video.srcObject = null;
        controls.innerHTML = '';
        note.textContent = '相机已停止。';
        setReadout('#manual-r-status', '已停止');
        ctx.setStatus('LIMITED', 'partial');
      });

      start();
    }
  });
})(window.SC = window.SC || {});

</script>
  <script>
/* ./js/sensors/biometrics.js */
(function (SC) {
  'use strict';

  SC.registerSensor({
    id: 'biometrics',
    name: 'Face ID / Touch ID',
    en: 'BIOMETRICS',
    group: '计算与身份',
    icon: 'biometrics',
    probe: function () {
      return {
        status: 'info',
        reason: '网页拿不到脸或指纹数据；只能借助系统登录流程做认证。'
      };
    },
    mount: function (ctx) {
      ctx.root.innerHTML =
        '<div class="module module-biometrics">' +
        '<div class="info-panel">' +
        '<div class="info-head"><div class="info-icon">' +
        SC.ui.icons.biometrics +
        '</div><div><h3>村民交易台</h3><p>Face ID / Touch ID 在网页里的真实边界</p></div></div>' +
        '<p class="module-note">浏览器不会把脸、指纹或 Secure Enclave 里的模板交给 JavaScript。网页能做的只有：调用系统认证流程，拿到一个「通过 / 不通过」的结果。</p>' +
        '<div class="readout-grid">' +
        '<div class="readout-cell"><span class="cell-label">读取生物数据</span><span class="cell-value warn-text">不可能</span></div>' +
        '<div class="readout-cell"><span class="cell-label">系统登录认证</span><span class="cell-value ok-text">可用（需 WebAuthn）</span></div>' +
        '<div class="readout-cell"><span class="cell-label">识别结果</span><span class="cell-value">只有成功/失败</span></div>' +
        '<div class="readout-cell"><span class="cell-label">后端要求</span><span class="cell-value">需要服务器</span></div>' +
        '</div>' +
        '<div class="reason-box"><strong>为什么不能读？</strong> 生物特征属于系统安全区。网页只能请求「验证一下这个人」，不能请求「把脸的数据给我」。这是设计上的隔离，不是权限没开。</div>' +
        '<ul class="alt-list">' +
        '<li>可以做：网站登录、支付确认、二次验证（WebAuthn / Passkeys）。</li>' +
        '<li>不可以做：读取指纹图像、读取 Face ID 深度图、做本地人脸识别。</li>' +
        '<li>替代方案：如果要采集人脸做实验，用摄像头模块，但不要做身份认证或医疗判断。</li>' +
        '</ul>' +
        '<div class="module-toolbar">' +
        '<button class="mc-btn" type="button" id="bio-more">查看 WebAuthn 说明</button>' +
        '<button class="mc-btn primary" type="button" id="bio-check">检测平台认证器</button>' +
        '</div>' +
        '<div class="module-note" id="bio-extra" hidden>WebAuthn 是浏览器标准：网站生成挑战，系统弹出 Face ID/Touch ID，成功后返回签名公钥凭证。网页本身仍然拿不到生物模板。</div>' +
        '</div></div>';

      ctx.setReadout(
        '<div class="readout-title"><span>村民交易台</span><span>VILLAGER</span></div>' +
          '<div class="readout-row"><span class="readout-label">生物数据</span><span class="readout-value warn-text">不可读取</span></div>' +
          '<div class="readout-row"><span class="readout-label">系统认证</span><span class="readout-value">WebAuthn</span></div>' +
          '<div class="readout-row"><span class="readout-label">平台</span><span class="readout-value">iOS Secure Enclave</span></div>' +
          '<div class="readout-row"><span class="readout-label">平台认证器</span><span class="readout-value" id="bio-r-auth">未检测</span></div>' +
          '<div class="readout-row"><span class="readout-label">状态</span><span class="readout-value">信息卡</span></div>'
      );

      var more = ctx.root.querySelector('#bio-more');
      var extra = ctx.root.querySelector('#bio-extra');
      var checkBtn = ctx.root.querySelector('#bio-check');
      var seen = false;
      more.addEventListener('click', function () {
        extra.hidden = !extra.hidden;
        more.textContent = extra.hidden ? '查看 WebAuthn 说明' : '收起说明';
        if (!seen) {
          seen = true;
          ctx.toast({ icon: 'biometrics', title: '成就达成！', subtitle: '交易达成：读完生物识别边界' });
        }
      });

      checkBtn.addEventListener('click', async function () {
        var target = ctx.readout.querySelector('#bio-r-auth');
        checkBtn.disabled = true;
        checkBtn.textContent = '检测中…';
        if (!window.PublicKeyCredential) {
          if (target) target.textContent = '不支持 WebAuthn';
          checkBtn.disabled = false;
          checkBtn.textContent = '检测平台认证器';
          return;
        }
        try {
          var available = await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
          if (target) target.textContent = available ? '可用（Face ID/Touch ID）' : '不可用';
          ctx.toast({
            icon: 'biometrics',
            title: available ? '平台认证器可用' : '平台认证器不可用',
            subtitle: available ? '可以用 WebAuthn 做系统登录验证' : '浏览器或设备未开放平台认证器'
          });
          SC.core.log.add('平台认证器：' + (available ? '可用' : '不可用'));
        } catch (error) {
          if (target) target.textContent = '检测失败';
          ctx.toast({ icon: 'barrier', title: '检测失败', subtitle: error && error.message ? error.message : '未知错误' });
        }
        checkBtn.disabled = false;
        checkBtn.textContent = '重新检测';
      });

      ctx.setStatus('INFO', 'info');
    }
  });
})(window.SC = window.SC || {});

</script>

/* ./js/main.js */
(function (SC) {
  'use strict';

  function boot() {
    SC.core.log.init();
    SC.core.probe.scan();
    SC.core.probe.run(SC.core.registry.all());

    SC.ui.hud.init();
    SC.ui.hud.setSecureBanner();
    SC.ui.bag.render();
    SC.ui.gate.init();
    SC.core.lifecycle.init();

    var summary = SC.core.probe.summary();
    SC.core.log.add(
      '世界已加载：' + summary.ready + ' 可用 / ' + summary.partial + ' 受限 / ' + summary.locked + ' 未解锁'
    );

    if (!window.isSecureContext) {
      SC.core.log.add('非安全上下文：摄像头、麦克风、定位会被浏览器拒绝。');
    }

    window.SENSORCRAFT = SC;
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot, { once: true });
  } else {
    boot();
  }
})(window.SC = window.SC || {});

</script>
